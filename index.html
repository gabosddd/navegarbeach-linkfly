  <!-- DEV: auto-reload em localhost enquanto acompanhamos as alterações -->
  <script>
    if (['localhost', '127.0.0.1'].includes(location.hostname)) {
      const watch = ['index.html', 'styles.css', 'script.js'];
      let sig = null;
      setInterval(async () => {
        try {
          const tags = await Promise.all(watch.map(f =>
            fetch(f + '?_=' + Date.now(), { method: 'HEAD' })
              .then(r => r.headers.get('last-modified') || r.headers.get('etag') || '')
          ));
          const next = tags.join('|');
          if (sig && next !== sig) location.reload();
          sig = next;
        } catch (e) {}
      }, 1200);
    }
  </script>
